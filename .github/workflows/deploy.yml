name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita dos despliegues simultáneos; si llega un push nuevo, cancela el anterior
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR exige nombres en minúscula
  IMAGE_PREFIX: ghcr.io/mahg24/portfolio

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: front
            context: apps/front
            dockerfile: apps/front/dockerfile
          - app: back
            context: apps/back
            dockerfile: apps/back/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
          # Solo el front usa build args; el back los ignora
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/api' }}
            NEXT_PUBLIC_USER_EMAIL=${{ vars.NEXT_PUBLIC_USER_EMAIL || 'mahg0524@gmail.com' }}
            BACKEND_URL=${{ vars.BACKEND_URL || 'http://back:5000' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"

            # Trae cambios del docker-compose.yml y demás archivos del repo
            git pull --ff-only

            # El token de Actions solo vale durante este job: login, pull y logout
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            IMAGE_TAG="$IMAGE_TAG" docker compose pull
            docker logout ghcr.io

            IMAGE_TAG="$IMAGE_TAG" docker compose up -d --no-build --remove-orphans
            docker image prune -f
